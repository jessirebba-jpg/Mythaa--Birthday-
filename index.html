<style>
:root{--pink:#d52f62;--ink:#65414b;--muted:#a77c86;--mint:#e8fbf3}
*{box-sizing:border-box}body{margin:0;min-height:100svh;overflow-x:hidden;display:flex;align-items:center;justify-content:center;padding:25px 14px;background:radial-gradient(ellipse at 50% 38%,#fffdf9 0,#fff6f3 48%,#f8dbe4 100%);font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#dca0b2 1px,transparent 1px);background-size:10px 10px;opacity:.18;mask-image:linear-gradient(transparent 15%,black 100%)}
.card{position:relative;width:min(100%,660px);min-height:min(83svh,1120px);padding:40px 25px 28px;border:1px solid #fff;border-radius:42px;background:rgba(255,250,246,.88);box-shadow:0 20px 65px #bd6b8522,inset 0 0 30px #fff9;display:flex;flex-direction:column;align-items:center;text-align:center;animation:open .9s ease-out both}

.kicker{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#bd647e;font-weight:bold;margin:0 0 25px}h1{font-size:clamp(36px,8vw,62px);font-weight:400;font-style:italic;line-height:1.04;margin:0;color:#68404c}h1 span{display:block;color:#d73568}.sub{font-size:clamp(15px,3.5vw,22px);letter-spacing:1px;color:#a47782;margin:28px 0 0}.art{width:min(76%,350px);height:auto;object-fit:contain;margin:25px auto 8px;border-radius:12px;mix-blend-mode:multiply;animation:bob 3.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.prompt{font-size:clamp(17px,4vw,26px);font-weight:bold;margin:18px 0 28px;line-height:1.4}.buttons{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;width:100%}button{font:700 17px Georgia,serif;border-radius:22px;padding:17px 24px;cursor:pointer;transition:transform .2s,filter .2s;min-width:150px}button:active{transform:scale(.96)}.yes{border:0;color:white;background:linear-gradient(135deg,#e33e72,#c92359);box-shadow:0 7px 0 #ad204d,0 12px 22px #d52f6233}.no{background:var(--mint);color:#6d9385;border:1px solid #b8e6d5;box-shadow:0 6px 0 #c7e8dc}.hint{font-size:14px;color:#b77e8e;margin:19px 0 20px}.reply{font-size:16px;color:#bc456c;min-height:25px;margin:0 0 8px}.footer{margin-top:auto;padding-top:40px;color:#bd8795;font-size:12px;letter-spacing:3px}.float{position:fixed;top:-40px;z-index:5;pointer-events:none;animation:fall linear infinite;opacity:.85}@keyframes fall{to{transform:translateY(110svh) rotate(300deg)}}
@media(max-height:750px){.card{min-height:0;padding:28px 20px}.kicker{margin-bottom:16px}.art{width:min(58%,250px);margin:14px auto}.sub{margin-top:18px}.prompt{margin:12px 0 18px}.footer{padding-top:22px}}

.card h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:-.025em}
.card h1 span{font-family:"Great Vibes","Playfair Display",cursive;font-weight:500;letter-spacing:0}

<!-- Background music -->
<audio id="birthdayMusic" src="./background-music.mp3" preload="auto" loop playsinline></audio>
<script>
(() => {
const audio=document.getElementById("birthdayMusic");
const timeKey="mahiiBirthdayMusicTime";
const startedKey="mahiiBirthdayMusicStarted";
let savedTime=0;
try{savedTime=Number(sessionStorage.getItem(timeKey)||0);}catch(e){}
audio.addEventListener("loadedmetadata",()=>{
try{
if(savedTime>0&&Number.isFinite(savedTime)&&savedTime<audio.duration){
audio.currentTime=savedTime;
}
if(sessionStorage.getItem(startedKey)==="yes"){audio.play().catch(()=>{});}
}catch(e){}
},{once:true});
function startMusic(){
try{sessionStorage.setItem(startedKey,"yes");}catch(e){}
audio.play().catch(()=>{});
document.removeEventListener("pointerdown",startMusic,true);
document.removeEventListener("keydown",startMusic,true);
document.removeEventListener("click",startMusic,true);
}
document.addEventListener("pointerdown",startMusic,true);
document.addEventListener("keydown",startMusic,true);
document.addEventListener("click",startMusic,true);
function savePosition(){
try{sessionStorage.setItem(timeKey,String(audio.currentTime||0));}catch(e){}
}
window.addEventListener("pagehide",savePosition);
window.addEventListener("beforeunload",savePosition);
audio.play().catch(()=>{});
})();
</script>
</body>
</html>
